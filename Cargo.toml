[package]
name = "epistem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Open capability registry and catalog for autonomous agents"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
