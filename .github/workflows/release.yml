name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Builds the binary, packages it as `epistem-<target>.tar.gz` with the raw
      # `epistem` executable at the archive root, and attaches it to the release
      # for this tag. This is exactly what install.sh downloads.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: epistem
          target: ${{ matrix.target }}
          archive: $bin-$target
          tar: unix
          token: ${{ secrets.GITHUB_TOKEN }}
